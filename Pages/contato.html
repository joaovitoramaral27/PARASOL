<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasol Viagens</title>
    <link rel="icon" sizes="64x64" href="../Img/Logo.png">
    <link rel="stylesheet" href="../CSS/contato.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="headr">
                <h1>PARASOL  </h1><h2>  Viagens</h2>
                <img src="../Img/Logo.png" alt="Logo da Parasol Viagens">
            </div>
            <div class="navbar">
                <nav>
                    <a href="../Pages/sobre.html">Sobre Nós</a>
                    <a href="../Pages/contato.html">Contato</a>
                    <a href="../Pages/destinos.html">Destinos</a>
                    <a href="../Pages/reserva.html">Reservas</a>
                </nav>
            </div>
            <div class="telacontato">
                <div class="texto">
                    <h1 class="contato">Entre em Contato Conosco</h1>
                    <p><strong>Você pode nos contatar através dos seguintes canais:</strong></p>
                    <ul>
                        <li><strong>Email:</strong> contato@parasol.com</li>
                        <li><strong>Telefone:</strong> (xx) xxxx-xxxx</li>
                        <li><strong>Endereço:</strong> Rua Paralamas xxx - Do Sucesso/PS</li>
                    </ul>
                </div>
                <div class ="formulario">
                    <h1 class="contato">Envie uma Mensagem</h1>
                    <form class="formulario-preenchivel">
                        <label for="tipo">Categoria:</label>
                        <select id="tipo" name="tipo">
                            <option>Sugestão</option>
                            <option>Reclamação</option>
                            <option>Avaliação</option>
                            <option>Outro</option>
                        </select>

                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome">

                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>

                        <button type="submit">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
